name: Verify package

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check committed dist matches build
        run: git diff --exit-code dist
      - run: npm pack --dry-run
